[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-collector"
version = "0.1.0"
description = "媒体采集：分享链接下载"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "yt-dlp>=2024.0.0",
]

[tool.setuptools.packages.find]
include = ["media_collector*"]
