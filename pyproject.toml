[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-collector"
version = "0.1.0"
description = "媒体采集：下载视频、获取作者作品列表"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "yt-dlp>=2024.0.0",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["core/download_video", "core/list_author_works", "core/media_collector"]
